<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budget Desk · System Tour</title>
<style>
  @font-face { font-family: 'Inter'; src: local('Segoe UI'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #05080f;
    color: #e2e8f0;
    display: grid;
    place-items: center;
    position: relative;
  }
  .blob { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(120px); opacity: .30; }
  .a { top: -320px; left: -220px; background: radial-gradient(circle, #6ee7b7, transparent 65%); }
  .b { top: -200px; right: -320px; background: radial-gradient(circle, #67e8f9, transparent 65%); }
  .c { bottom: -420px; left: 30%; background: radial-gradient(circle, #c4b5fd, transparent 65%); }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(to right, rgba(148,163,184,.09) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(148,163,184,.09) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, #000 30%, transparent 100%);
  }
  .wrap { position: relative; text-align: center; max-width: 1180px; padding: 0 40px; }
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    border: 1px solid rgba(52,211,153,.35);
    background: rgba(52,211,153,.10);
    color: #6ee7b7;
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 13px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 6px rgba(52,211,153,.15); }
  .logo {
    width: 108px; height: 108px; margin: 38px auto 30px;
    border-radius: 32px;
    background: linear-gradient(135deg, #6ee7b7, #34d399 45%, #22d3ee);
    display: grid; place-items: center;
    box-shadow: 0 30px 90px -20px rgba(16,185,129,.65);
  }
  .logo svg { width: 58px; height: 58px; }
  h1 { font-size: 92px; line-height: 1.02; letter-spacing: -3.5px; font-weight: 800; color: #fff; }
  h1 span { background: linear-gradient(100deg, #6ee7b7, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 22px; font-size: 25px; color: #94a3b8; letter-spacing: .01em; }
  .pills { margin-top: 46px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .pill {
    border: 1px solid rgba(255,255,255,.10);
    background: rgba(255,255,255,.045);
    border-radius: 999px; padding: 11px 20px;
    font-size: 16px; font-weight: 600; color: #cbd5e1;
  }
  .meta { position: absolute; bottom: 52px; left: 0; right: 0; text-align: center; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: #475569; }
</style>
</head>
<body>
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div><div class="grid"></div>
  <div class="wrap">
    <div class="badge"><span class="dot"></span> System tour · every screen explained</div>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#04121a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.5" y="6" width="19" height="12" rx="2.5"></rect>
        <circle cx="12" cy="12" r="2.6"></circle>
        <path d="M6 9.5h.01M18 14.5h.01"></path>
      </svg>
    </div>
    <h1>Budget <span>Desk</span></h1>
    <p class="sub">Personal finance, payday by payday.</p>
    <div class="pills">
      <span class="pill">Expenses</span><span class="pill">Paydays</span><span class="pill">Bills</span>
      <span class="pill">Budgets</span><span class="pill">Savings advice</span><span class="pill">Goals</span>
      <span class="pill">Accounts</span><span class="pill">Reports</span>
    </div>
  </div>
  <div class="meta">Local · private · built for the 15th and month-end cycle</div>
</body>
</html>
