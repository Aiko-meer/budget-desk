<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Budget Desk · Tour complete</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #05080f; color: #e2e8f0;
    display: grid; place-items: center; position: relative;
  }
  .blob { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(120px); opacity: .30; }
  .a { top: -320px; left: -220px; background: radial-gradient(circle, #6ee7b7, transparent 65%); }
  .b { bottom: -380px; right: -260px; background: radial-gradient(circle, #67e8f9, transparent 65%); }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(to right, rgba(148,163,184,.09) 1px, transparent 1px),
                      linear-gradient(to bottom, rgba(148,163,184,.09) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 30%, transparent 100%);
  }
  .wrap { position: relative; text-align: center; max-width: 1150px; padding: 0 40px; }
  .check {
    width: 104px; height: 104px; margin: 0 auto 32px;
    border-radius: 50%;
    background: rgba(52,211,153,.12);
    border: 1px solid rgba(52,211,153,.45);
    display: grid; place-items: center;
    color: #6ee7b7;
    box-shadow: 0 0 80px -10px rgba(52,211,153,.5);
  }
  .check svg { width: 50px; height: 50px; }
  h1 { font-size: 74px; line-height: 1.05; letter-spacing: -2.5px; font-weight: 800; color: #fff; }
  h1 span { background: linear-gradient(100deg, #6ee7b7, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 20px; font-size: 24px; color: #94a3b8; }
  .row { margin-top: 48px; display: flex; gap: 16px; justify-content: center; }
  .card {
    min-width: 240px;
    border: 1px solid rgba(255,255,255,.09);
    background: rgba(255,255,255,.04);
    border-radius: 18px; padding: 20px 24px; text-align: left;
  }
  .card b { display: block; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #64748b; font-weight: 700; }
  .card span { display: block; margin-top: 8px; font-size: 19px; color: #e2e8f0; font-weight: 600; }
  .meta { position: absolute; bottom: 52px; left: 0; right: 0; text-align: center; font-size: 14px; letter-spacing: .16em; text-transform: uppercase; color: #475569; }
</style>
</head>
<body>
  <div class="blob a"></div><div class="blob b"></div><div class="grid"></div>
  <div class="wrap">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12.5l5 5L20 6.5"></path>
      </svg>
    </div>
    <h1>You've seen <span>every screen.</span></h1>
    <p class="sub">Log a payday, add expenses, and let the savings advisor do the math.</p>
    <div class="row">
      <div class="card"><b>Run locally</b><span>php artisan serve</span></div>
      <div class="card"><b>Login</b><span>me@budgetdesk.local</span></div>
      <div class="card"><b>Data</b><span>On your machine only</span></div>
    </div>
  </div>
  <div class="meta">Budget Desk · private, offline-first personal finance</div>
</body>
</html>
